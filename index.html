<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses WiFi Mixue</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f8; 
            margin: 0; 
            padding: 20px 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        .card { 
            background: white; 
            border-radius: 20px; 
            padding: 24px 20px; 
            width: 100%; 
            max-width: 360px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        h2 {
            margin: 0 0 16px 0;
            color: #1a1a1a;
            font-size: 20px;
        }
        .wifi-box { 
            background: #f8f9fa; 
            border: 1px solid #e9ecef; 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 16px; 
            text-align: left; 
        }
        .label { 
            font-size: 11px; 
            color: #6c757d; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .val { 
            font-family: monospace; 
            font-size: 14px; 
            color: #212529; 
            font-weight: bold; 
            margin-top: 2px;
            margin-bottom: 10px; 
            word-break: break-all; 
        }
        .val:last-child {
            margin-bottom: 0;
        }
        .btn-connect { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            background-color: #0d6efd; 
            color: white; 
            text-decoration: none;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
        }
        .qr-section {
            background: #ffffff;
            border: 2px dashed #dee2e6;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        #qrcode-img { 
            width: 170px; 
            height: 170px; 
            margin: 0 auto; 
            display: block; 
        }
        .qr-instruction { 
            font-size: 12px; 
            color: #495057; 
            font-weight: 600; 
            line-height: 1.4;
            margin-top: 10px;
        }
        .btn-copy { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            background-color: #e9ecef; 
            color: #495057; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📶 WiFi Pelanggan Mixue</h2>
    
    <!-- Informasi Teks WiFi -->
    <div class="wifi-box">
        <div class="label">Nama WiFi (SSID)</div>
        <div class="val">PELANGGAN MIXUE FREE WIFI</div>
        
        <div class="label">Kata Sandi</div>
        <div class="val">kenangan#manis11</div>
    </div>

    <!-- FITUR 1: Tombol Sambung Otomatis -->
    <a id="btn-wifi-auto" href="" class="btn-connect">⚡ Sambung Otomatis</a>

    <!-- FITUR 2: Area QR Code untuk di-scan Kamera -->
    <div class="qr-section">
        <img id="qrcode-img" src="" alt="QR Code WiFi">
        <div class="qr-instruction">
            📸 Atau arahkan kamera HP ke QR Code di atas untuk menyambung otomatis
        </div>
    </div>

    <!-- FITUR 3: Tombol Salin Password (Cadangan) -->
    <button onclick="copyPassword()" class="btn-copy">📋 Salin Password</button>
</div>

<script>
    const wifiSSID = "PELANGGAN MIXUE FREE WIFI";
    const wifiPass = "kenangan#manis11";
    const wifiType = "WPA";

    // Format Skema URI WiFi Universal
    const wifiURI = `WIFI:S:${wifiSSID};T:${wifiType};P:${wifiPass};;`;

    // 1. Set Perintah Sambung Otomatis ke Tombol
    document.getElementById("btn-wifi-auto").href = wifiURI;

    // 2. Generate QR Code Gambar secara Otomatis
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(wifiURI)}`;
    document.getElementById("qrcode-img").src = qrApiUrl;

    // 3. Fungsi Salin Password Cadangan
    function copyPassword() {
        navigator.clipboard.writeText(wifiPass).then(() => {
            alert("Password berhasil disalin: kenangan#manis11");
        }).catch(() => {
            alert("Password: kenangan#manis11");
        });
    }
</script>

</body>
</html>
