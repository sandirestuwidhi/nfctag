<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Mixue</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f8; 
            margin: 0; 
            padding: 20px 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        .card { 
            background: white; 
            border-radius: 20px; 
            padding: 24px 20px; 
            width: 100%; 
            max-width: 360px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        h2 { margin: 0 0 16px 0; color: #1a1a1a; font-size: 20px; }
        .wifi-box { 
            background: #f8f9fa; 
            border: 1px solid #e9ecef; 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 16px; 
            text-align: left; 
        }
        .label { font-size: 11px; color: #6c757d; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .val { font-family: monospace; font-size: 14px; color: #212529; font-weight: bold; margin-top: 2px; margin-bottom: 10px; word-break: break-all; }
        .val:last-child { margin-bottom: 0; }
        .btn-connect { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            background-color: #0d6efd; 
            color: white; 
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
            transition: 0.2s;
        }
        .btn-connect:active { background-color: #0b5ed7; }
        .qr-section {
            background: #ffffff;
            border: 2px dashed #dee2e6;
            border-radius: 16px;
            padding: 16px;
        }
        #qrcode-img { width: 170px; height: 170px; margin: 0 auto; display: block; }
        .qr-instruction { font-size: 12px; color: #495057; font-weight: 600; line-height: 1.4; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>WiFi Pelanggan Mixue</h2>
    
    <div class="wifi-box">
        <div class="label">Nama WiFi (SSID)</div>
        <div class="val">PELANGGAN MIXUE FREE WIFI</div>
        
        <div class="label">Kata Sandi</div>
        <div class="val">kenangan#manis11</div>
    </div>

    <!-- Tombol Salin Password Interaktif -->
    <button id="copy-btn" onclick="copyPassword()" class="btn-connect">⚡ Salin Password & Konek</button>

    <!-- Area QR Code untuk Scan Kamera -->
    <div class="qr-section">
        <img id="qrcode-img" src="" alt="QR Code WiFi">
        <div class="qr-instruction">
            📸 Atau scan QR Code di atas dengan Kamera HP untuk langsung tersambung otomatis
        </div>
    </div>
</div>

<script>
    const wifiSSID = "PELANGGAN MIXUE FREE WIFI";
    const wifiPass = "kenangan#manis11";
    const wifiType = "WPA";

    // Format URI WiFi Universal
    const wifiURI = `WIFI:S:${wifiSSID};T:${wifiType};P:${wifiPass};;`;

    // Generate QR Code Gambar
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(wifiURI)}`;
    document.getElementById("qrcode-img").src = qrApiUrl;

    // Fungsi Salin Password dengan Efek Teks Berubah
    function copyPassword() {
        navigator.clipboard.writeText(wifiPass).then(() => {
            const btn = document.getElementById("copy-btn");
            btn.innerText = "✓ Password Berhasil Disalin!";
            btn.style.backgroundColor = "#198754";
            setTimeout(() => {
                btn.innerText = "⚡ Salin Password & Konek";
                btn.style.backgroundColor = "#0d6efd";
            }, 3000);
            alert("Password 'kenangan#manis11' sudah disalin!\nSilakan pilih WiFi 'PELANGGAN MIXUE FREE WIFI' di menu HP lalu paste/tempel.");
        });
    }
</script>

</body>
</html>
